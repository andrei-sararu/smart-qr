name: Initialize Smart QR D1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate Cloudflare credentials (no secrets printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then echo 'ERROR: CLOUDFLARE_API_TOKEN missing in repository Actions secrets'; exit 1; fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then echo 'ERROR: CLOUDFLARE_ACCOUNT_ID missing in repository Actions secrets'; exit 1; fi
          if [[ "$CLOUDFLARE_API_TOKEN" == *[[:space:]]* || "$CLOUDFLARE_API_TOKEN" == Bearer\ * || "$CLOUDFLARE_API_TOKEN" == *\"* || "$CLOUDFLARE_API_TOKEN" == *\'* ]]; then echo 'ERROR: API token includes whitespace, quotes or Bearer prefix; paste the raw token only'; exit 1; fi
          if [[ ! "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then echo 'ERROR: API token contains invalid characters. Copy only the raw Cloudflare API token'; exit 1; fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then echo 'ERROR: CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID'; exit 1; fi
          echo 'Credential format checks passed (not a permission or validity check)'
      - name: Apply tracked D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"name":"smart-qr","compatibility_date":"2026-05-15","d1_databases":[{"binding":"DB","database_name":"smart-qr-db","database_id":"a68f2235-4fa7-4fe8-9ca7-f5b50c184413","migrations_dir":"drizzle"}]}' > wrangler.migrations.json
          npx --yes wrangler@4.92.0 d1 migrations apply smart-qr-db --remote --config wrangler.migrations.json
          npx --yes wrangler@4.92.0 d1 execute smart-qr-db --remote --config wrangler.migrations.json --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
