<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartQR Business Admin</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#182a35;background:#f4f6fa}header{padding:18px 24px;background:#132b46;color:white;display:flex;justify-content:space-between}header a{color:white}nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px;background:white;border-bottom:1px solid #dce2ea}button{font:inherit;border:1px solid #b5c3d2;background:white;border-radius:5px;padding:9px 14px;cursor:pointer}button.primary{background:#245a9b;color:white;border-color:#245a9b}main{padding:24px;max-width:1500px;margin:auto}h1{font-size:24px}h2{font-size:18px}section,article{background:white;border:1px solid #dce2ea;border-radius:8px;padding:16px;margin:10px 0}label{display:block;margin:8px 0}input,select,textarea{font:inherit;padding:8px;border:1px solid #b5c3d2;border-radius:4px;width:100%}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3e8ef;overflow-wrap:anywhere}th{background:#eef2f7}.scroll{overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font-size:26px;font-weight:650}.muted{color:#607185}#message{min-height:20px}a{color:#245a9b}</style></head><body><header><strong>SmartQR | Business Admin</strong><span id="identity"></span><a href="/smartqr">Product</a></header><nav id="nav"></nav><main><h1 id="heading">Overview</h1><p id="message" role="status"></p><div id="content"></div></main><script>
const $=id=>document.getElementById(id),stages=['New','Qualified','Demo','Trial','Won','Lost'];let me,staff=[],leads=[];
const node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};
async function api(path,method='GET',data){const r=await fetch('/api/smartqr/crm/'+path,{method,...(data?{headers:{'content-type':'application/json'},body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
const msg=s=>$('message').textContent=s;
function button(text,fn){const b=node('button',text);b.type='button';b.onclick=()=>Promise.resolve().then(fn).catch(e=>msg(e.message));return b}
function table(rows,cols,action){const wrap=node('div');wrap.className='scroll';const t=node('table'),head=node('tr');for(const [label]of cols)head.append(node('th',label));if(action)head.append(node('th','Actions'));t.append(head);for(const row of rows){const tr=node('tr');for(const [,key]of cols)tr.append(node('td',typeof key==='function'?key(row):String(row[key]??'')));if(action){const td=node('td');td.append(action(row));tr.append(td)}t.append(tr)}wrap.append(t);return wrap}
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format((n||0)/100);
const date=n=>n?new Date(n).toLocaleString():'—';
function field(f,label,name,value='',options=null,type='text'){const l=node('label',label),i=node(options?'select':type==='textarea'?'textarea':'input');i.name=name;if(options){for(const [v,t]of options){const o=node('option',t);o.value=v;i.append(o)}}else if(type!=='textarea')i.type=type;i.value=value??'';l.append(i);f.append(l);return i}
function form(parent,title,build,save){const section=node('section');section.append(node('h2',title));const f=node('form');build(f);const b=node('button','Save');b.className='primary';b.type='submit';f.append(b);f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await save(Object.fromEntries(new FormData(f)));msg('Saved')}catch(e){msg(e.message)}finally{b.disabled=false}};section.append(f);parent.append(section);return section}
const staffOptions=()=>[['','Unassigned'],...staff.filter(x=>x.enabled).map(x=>[x.id,x.email])];
async function show(page){msg('');$('heading').textContent=page;const c=$('content');c.replaceChildren();
 if(page==='Overview'){const d=await api('overview'),cards=node('div');cards.className='cards';for(const s of stages){const r=d.pipeline.find(x=>x.stage===s),a=node('article');a.append(node('div',s),node('div',String(r?.count||0)),node('p',money(r?.value_pence)));cards.append(a)}c.append(cards,node('p','Open tasks: '+d.openTasks));if(d.customers)c.append(node('p','SmartQR accounts: '+d.customers.accounts+' · Active trials: '+(d.customers.activeTrials||0)));if(d.marketing)c.append(node('p','Newsletter: '+d.marketing.map(x=>x.status+' '+x.count).join(' · ')));c.append(node('p','Pipeline value is potential sales, not actual revenue. Stripe revenue is not connected.'));return}
 if(page==='Leads'){leads=(await api('leads')).leads;if(me.access.sales)staff=(await api('staff')).staff;const edit=r=>{const old=document.getElementById('leadEditor');if(old)old.remove();const s=form(c,r?'Edit lead':'New lead',f=>{field(f,'Company','company',r?.company);field(f,'Contact','contact',r?.contact);field(f,'Email','email',r?.email,null,'email');field(f,'Stage','stage',r?.stage||'New',stages.map(x=>[x,x]));field(f,'Source','source',r?.source);field(f,'Owner','owner_id',r?.owner_id,staffOptions());field(f,'Estimated value (£)','value',r?r.value_pence/100:0,null,'number').step='0.01';field(f,'Notes','notes',r?.notes,null,'textarea')},async d=>{await api('leads'+(r?'/'+r.id:''),r?'PATCH':'POST',{...d,value_pence:Math.round(Number(d.value)*100),revision:r?.revision});await show('Leads')});s.id='leadEditor';s.scrollIntoView()};if(me.access.sales)c.append(button('New lead',()=>edit(null)));const search=node('input');search.placeholder='Search company, contact, email or stage';c.append(search);const grid=node('div');c.append(grid);const render=()=>{const s=search.value.toLowerCase();grid.replaceChildren(table(leads.filter(r=>[r.company,r.contact,r.email,r.stage].some(v=>v.toLowerCase().includes(s))),[['Company','company'],['Contact','contact'],['Email','email'],['Stage','stage'],['Value',r=>money(r.value_pence)],['Owner',r=>staff.find(x=>x.id===r.owner_id)?.email||r.owner_id||'—']],me.access.sales?r=>button('Edit',()=>edit(r)):null))};search.oninput=render;render();return}
 if(page==='Tasks'){const d=await api('tasks');if(me.access.tasks){staff=(await api('staff')).staff;leads=(await api('leads')).leads;form(c,'New task',f=>{field(f,'Task','title');field(f,'Lead','lead_id','',[['','No lead'],...leads.map(x=>[x.id,x.company])]);field(f,'Owner','owner_id','',staffOptions());field(f,'Due date','due','',null,'date')},async x=>{await api('tasks','POST',{...x,due_at:x.due?Date.parse(x.due):null});await show('Tasks')})}c.append(table(d.tasks,[['Task','title'],['Status','status'],['Due',r=>date(r.due_at)],['Owner',r=>staff.find(x=>x.id===r.owner_id)?.email||r.owner_id||'—']],me.access.tasks?r=>button(r.status==='open'?'Complete':'Reopen',async()=>{await api('tasks/'+r.id,'PATCH',{status:r.status==='open'?'done':'open',revision:r.revision});await show('Tasks')}):null));return}
 if(page==='Customers'){const d=await api('customers');c.append(node('h2','SmartQR accounts'),table(d.accounts,[['Account ID','owner_id'],['Trial ends',r=>date(r.trial_end)],['Codes','links']]),node('h2','Restaurant accounts'),table(d.restaurants,[['Name','name'],['Plan','plan'],['Subscription','subscription_status']]));return}
 if(page==='Marketing'){const d=await api('marketing');c.append(node('p','Newsletter status is read-only. Only confirmed subscribers may receive marketing. Campaign sending is not connected.'),table(d.contacts,[['Email','email'],['Status','status'],['Source','source'],['Requested',r=>date(r.requested_at)],['Confirmed',r=>date(r.confirmed_at)]]));return}
 if(page==='Administrators'){const d=await api('staff');const edit=r=>form(c,r?'Update administrator':'Add administrator',f=>{field(f,'Verified identity ID','id',r?.id);field(f,'Email','email',r?.email,null,'email');field(f,'Role','role',r?.role||'viewer',['admin','sales','support','marketing','viewer'].map(x=>[x,x]));field(f,'Access','enabled',r&&!r.enabled?'no':'yes',[['yes','Enabled'],['no','Disabled']])},async x=>{await api('staff','POST',{...x,enabled:x.enabled==='yes'});await show('Administrators')});c.append(button('Add administrator',()=>edit(null)),table(d.staff,[['Email','email'],['Identity','id'],['Role','role'],['Access',r=>r.enabled?'Enabled':'Disabled']],r=>button('Edit',()=>edit(r))));return}
 if(page==='Audit'){const d=await api('audit');c.append(table(d.events,[['Time',r=>date(r.created_at)],['Actor','actor_id'],['Action','action'],['Record','entity_id']]));return}
}
(async()=>{try{me=await api('me');$('identity').textContent=me.user.email+' · '+me.user.role;const pages=['Overview','Leads','Tasks',...(me.access.customers?['Customers']:[]),...(me.access.marketing?['Marketing']:[]),...(me.access.staff?['Administrators']:[]),...(me.access.audit?['Audit']:[])];for(const p of pages)$('nav').append(button(p,()=>show(p)));if(me.access.customers){const a=node('a','Support desk');a.href='/smartqr/support?mode=admin';$('nav').append(a)}await show('Overview')}catch(e){msg(e.message)}})();
</script></body></html>
