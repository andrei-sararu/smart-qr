<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartQR Support</title><style>body{font:16px system-ui;background:#f4f7f5;color:#17382c;margin:0}main{max-width:900px;margin:auto;padding:24px}section,article{background:white;border:1px solid #d3ddd7;border-radius:10px;padding:18px;margin:12px 0}label{display:block;margin:10px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;font:inherit}button{padding:10px;font:inherit;margin:5px 0}a{color:#145e43}p{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><a href="/smartqr/account">My account</a> · <a href="/smartqr/admin">Business Admin</a><h1 id="title">Customer support</h1><p id="status" role="status"></p><a id="login" href="/api/smartqr/auth/login">Sign in</a><section id="newTicket" hidden><h2>New support ticket</h2><form id="create"><label>Subject<input name="subject" required maxlength="160"></label><label>Category<select name="category"><option>Billing</option><option>QR codes</option><option>Account</option><option>Restaurant menus</option><option>Other</option></select></label><label>Message<textarea name="body" required maxlength="5000"></textarea></label><button>Submit ticket</button></form></section><section id="list" hidden><h2>Tickets</h2><div id="tickets"></div></section><section id="thread" hidden><button id="back">Back to tickets</button><h2 id="subject"></h2><p id="details"></p><div id="messages"></div><form id="reply"><label>Reply<textarea name="body" required maxlength="5000"></textarea></label><button>Send reply</button></form><form id="manage" hidden><label>Status<select name="status"><option>open</option><option>waiting_customer</option><option>resolved</option></select></label><label>Priority<select name="priority"><option>low</option><option>normal</option><option>high</option><option>urgent</option></select></label><button>Update ticket</button></form></section></main><script>
const el=id=>document.getElementById(id),admin=new URLSearchParams(location.search).get('mode')==='admin',prefix='/api/smartqr/support/'+(admin?'admin/':''),node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};let current;
if(admin)el('title').textContent='Support desk';
async function api(path,method='GET',data){const r=await fetch(prefix+path,{method,...(data?{headers:{'content-type':'application/json'},body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function error(e){el('status').textContent=e.message}
async function load(){try{const d=await api('tickets');el('login').hidden=true;el('newTicket').hidden=admin;el('list').hidden=false;el('thread').hidden=true;el('status').textContent='';el('tickets').replaceChildren();for(const t of d.tickets){const a=node('article',''),b=node('button',t.subject);b.onclick=()=>open(t.id).catch(error);a.append(b,node('p',t.category+' · '+t.status+' · '+t.priority));el('tickets').append(a)}if(!d.tickets.length)el('tickets').append(node('p','No tickets yet.'))}catch(e){error(e)}}
async function open(id){const d=await api('tickets/'+id);current=id;el('list').hidden=true;el('newTicket').hidden=true;el('thread').hidden=false;el('subject').textContent=d.ticket.subject;el('details').textContent=d.ticket.status+' · '+d.ticket.priority;el('messages').replaceChildren();for(const m of d.messages){const a=node('article','');a.append(node('strong',m.author_type+' · '+new Date(m.created_at).toLocaleString()),node('p',m.body));el('messages').append(a)}el('manage').hidden=!admin;el('manage').elements.status.value=d.ticket.status;el('manage').elements.priority.value=d.ticket.priority}
el('back').onclick=load;
el('create').onsubmit=async e=>{e.preventDefault();try{const d=await api('tickets','POST',Object.fromEntries(new FormData(e.target)));e.target.reset();await open(d.id)}catch(e){error(e)}};
el('reply').onsubmit=async e=>{e.preventDefault();try{await api('tickets/'+current+'/reply','POST',Object.fromEntries(new FormData(e.target)));e.target.reset();await open(current)}catch(e){error(e)}};
el('manage').onsubmit=async e=>{e.preventDefault();try{await api('tickets/'+current,'PATCH',Object.fromEntries(new FormData(e.target)));await open(current)}catch(e){error(e)}};load();
</script></html>
