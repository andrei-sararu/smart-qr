<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartQR – My account</title><style>body{font:16px system-ui;margin:0;background:#f4f7f5;color:#17382c}main{max-width:900px;margin:auto;padding:24px}section{background:white;border:1px solid #d3ddd7;border-radius:12px;padding:20px;margin:16px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block}input{display:block;box-sizing:border-box;width:100%;padding:10px;margin-top:6px;border:1px solid #8da49a;border-radius:5px;font:inherit}button,a{color:#145e43}button{padding:10px;font:inherit}nav{display:flex;gap:16px;flex-wrap:wrap}</style></head><body><main><nav><a href="/smartqr">SmartQR</a><a href="/smartqr#demo">Demo</a><a href="/smartqr/privacy">Privacy</a><a href="/smartqr/support">Support</a></nav><h1>My account</h1><p id="status" role="status"></p><a id="login" href="/api/smartqr/auth/login">Sign in</a><div id="account" hidden><section><h2>Subscription</h2><p id="plan"></p><p>Paid upgrades are not available yet. No card will be charged.</p></section><section><h2>Billing details</h2><form id="profile"><label>Legal name<input name="company" maxlength="160" required></label><label>Billing address<input name="address" maxlength="240" required></label><label>City<input name="city" maxlength="100" required></label><label>Postal code<input name="postal_code" maxlength="32"></label><label>Country code (GB, US, etc.)<input name="country" maxlength="2" minlength="2" required></label><label>Tax/VAT ID<input name="tax_id" maxlength="80"></label><label>Company registration<input name="registration" maxlength="80"></label><button>Save billing profile</button></form></section><section><h2>Invoices</h2><p id="invoices">Invoice provider not connected. No invoices are available for download.</p></section><form method="post" action="/api/smartqr/auth/logout"><button>Sign out</button></form></div></main><script>
const el=id=>document.getElementById(id);async function api(path,method='GET',data){const r=await fetch('/api/smartqr/billing/'+path,{method,...(data?{headers:{'content-type':'application/json'},body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const d=await api('overview');el('account').hidden=false;el('login').hidden=true;el('plan').textContent=d.entitlement.plan+(d.entitlement.trial?' trial until '+new Date(d.entitlement.trialEnd).toLocaleDateString():'');if(d.profile)for(const [k,v]of Object.entries(d.profile)){const f=el('profile').elements.namedItem(k);if(f)f.value=v}el('status').textContent=''}catch(e){el('status').textContent=e.message}}
el('profile').onsubmit=async e=>{e.preventDefault();try{await api('profile','PUT',Object.fromEntries(new FormData(e.target)));el('status').textContent='Billing details saved.'}catch(e){el('status').textContent=e.message}};load();
</script></body></html>
