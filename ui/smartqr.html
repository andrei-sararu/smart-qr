<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartQR – Free QR code generator</title><meta name="description" content="Create and download a free QR code for your HTTPS website."><style>body{font:16px system-ui;margin:0;background:#f4f7f5;color:#17382c}main{max-width:760px;margin:auto;padding:24px}section{background:white;border:1px solid #d3ddd7;border-radius:16px;padding:24px;margin:20px 0}label,input,button{display:block;margin:8px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #8da49a;border-radius:6px;font:inherit}button,a.download{background:#145e43;color:white;padding:12px 16px;border:0;border-radius:8px;font:inherit;cursor:pointer;display:inline-block}img{width:200px;max-width:100%;display:block}article{border-top:1px solid #ddd;padding:16px 0}a{color:#145e43}small{display:block}button:disabled{opacity:.5}</style></head><body><main><a href="/">Tablemint restaurant menus</a><h1>SmartQR</h1><p>Create a free, permanent website QR code. No account needed.</p><section><h2>Static QR code</h2><form id="static"><label for="url">Website URL (HTTPS)</label><input id="url" type="url" maxlength="2000" required placeholder="https://example.com"><button>Generate QR</button></form><p id="message" role="status"></p><img id="image" alt="Generated QR code" hidden style="display:none"><a id="download" class="download" hidden style="display:none" download="smartqr.svg">Download SVG</a></section><section><h2>Dynamic QR – private beta</h2><p>Change your destination after printing. Scan counts include repeat visits and bots.</p><a href="/signin-with-chatgpt?return_to=%2Fsmartqr">Sign in</a><p id="status" role="status"></p><form id="create" hidden><label>Label<input name="label" maxlength="100" required></label><label>Destination<input name="destination" type="url" maxlength="2000" required></label><button>Create link</button></form><div id="links"></div></section></main><script>
const el=id=>document.getElementById(id);let blobUrl;
async function request(path,method='GET',data){const r=await fetch('/api/smartqr/'+path,{method,...(data?{headers:{'content-type':'application/json'},body:JSON.stringify(data)}:{})});if(!r.ok){let d;try{d=await r.json()}catch{}throw Error(d?.error||'Request failed');}return r}
el('static').onsubmit=async e=>{e.preventDefault();el('message').textContent='Generating…';el('image').style.display='none';el('download').style.display='none';try{const r=await request('static','POST',{url:el('url').value});if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(await r.blob());el('image').src=blobUrl;el('image').style.display='block';el('download').href=blobUrl;el('download').style.display='inline-block';el('message').textContent='Ready. Test the QR before printing.'}catch(err){el('message').textContent=err.message}};
function field(form,name,value){const l=document.createElement('label');l.textContent=name;const i=document.createElement('input');i.name=name;i.value=value;i.required=true;i.maxLength=name==='label'?100:2000;if(name==='destination')i.type='url';l.append(i);form.append(l);return i}
async function load(){try{const r=await request('links');const {links}=await r.json();el('create').hidden=false;el('status').textContent='Operator beta • '+links.length+'/100 codes';el('links').replaceChildren();for(const link of links){const a=document.createElement('article'),f=document.createElement('form');const label=field(f,'label',link.label),destination=field(f,'destination',link.destination);const info=document.createElement('small');info.textContent=link.scans+' redirect hits · '+(link.enabled?'Enabled':'Disabled');a.append(info);const b=document.createElement('button');b.textContent='Save destination';f.append(b);f.onsubmit=async e=>{e.preventDefault();await update(link,label.value,destination.value,!!link.enabled)};a.append(f);const toggle=document.createElement('button');toggle.textContent=link.enabled?'Disable':'Enable';toggle.onclick=()=>update(link,label.value,destination.value,!link.enabled);a.append(toggle);const download=document.createElement('a');download.href='/api/smartqr/links/'+link.id+'/svg';download.download='smartqr-'+link.id+'.svg';download.textContent=' Download SVG';a.append(download);el('links').append(a)}}catch(e){el('status').textContent=e.message;el('create').hidden=true;el('links').replaceChildren()}}
async function update(link,label,destination,enabled){try{await request('links/'+link.id,'PATCH',{label,destination,enabled,revision:link.revision});await load()}catch(e){el('status').textContent=e.message}}
el('create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await request('links','POST',{label:f.get('label'),destination:f.get('destination')});e.target.reset();await load()}catch(e){el('status').textContent=e.message}};load();
</script></body></html>
