function home(){return `<div class="wrap"><section class="hero"><div><span class="eyebrow">A fresh way to serve</span><h1>Good food.<br>Great service.<br><em>Less waiting.</em></h1><p class="lead">Your menu, beautifully digital. Let guests explore, call your team and enjoy the moment — all from one little QR code.</p><div class="actions"><button class="btn primary" onclick="onboard()">Build your first menu <span>↗</span></button><button class="btn light" onclick="go('menu')">Explore the demo →</button></div><div class="fine">Start free · No app for guests · No card required in demo</div></div><div class="hero-art"><div class="orbit"></div><div class="orbit two"></div><div class="float two"><span class="dot"></span>Table 07 · Your guests are ready</div><div class="phone"><div class="photo"><h3>The Greenhouse</h3><span style="font-size:10px">Seasonal food. Shared moments.</span></div><div class="inside"><b style="font-size:14px">Something delicious awaits.</b><p>Freshly made, thoughtfully served.</p><div class="pills"><span class="pill">All dishes</span><span class="pill">Starters</span><span class="pill">Mains</span></div>${seed.slice(0,2).map(d=>`<div class="mini-dish"><img src="${d.image}" alt="Illustrative dish"><div><b>${d.name}</b><span>€${d.price.toFixed(2)}</span></div></div>`).join('')}<div style="background:var(--brand-accent);color:white;padding:10px;text-align:center;border-radius:9px;font-size:10px">✧ Call your waiter</div></div></div><div class="float one">✓ &nbsp; Menu updated. Every table, instantly.</div></div></section><div class="benefits"><div><h3>01 &nbsp; Make it yours</h3><p>Photos, prices and your personality. A menu that feels like your place.</p></div><div><h3>02 &nbsp; Keep service flowing</h3><p>Guests ask. Your team sees. No more waving across the room.</p></div><div><h3>03 &nbsp; Start small. Grow naturally.</h3><p>A free menu today. More service tools when you need them.</p></div></div><section class="section" id="how"><span class="eyebr '+x+'</li>').join('')}</ul><button class="btn ${i===2?'':'primary'}" onclick="choose('${p[0]}')">${i?'Explore this plan':'Start with Free'} →</button></div>`).join('')}</div><p class="fine">Order & Pay is planned for a later release. Card processing fees would be separate.</p></section><div class="bottom"><div><h2>See both sides of better service.</h2><span class="muted">Try the guest menu, then pick up the request in the workspace.</span></div><button class="btn primary" onclick="go('menu')">Take a seat at table 7 →</button></div><footer><span>© ${new Date().getFullYear()} Smart QR · Working concept</span><span>Made for independent hospitality.</span></footer></div>`}
function dashboard(){let pending=state.calls.filter(c=>c.status!=='done');return `<div class="wrap app"><aside class="sidebar"><div class="venue"><span class="dot"></span>${esc(state.venue)}<p class="fine">${esc(state.plan)} · Demo location</p></div>${[['overview','◫','Overview'],['menu','☷','Menu editor'],['service','♧','Service board'],['qr','▦','Tables & QR'],['settings','⚙','Settings']].map(t=>`<button class="${tab===t[0]?'active':''}" onclick="tab='${t[0]}';render()">${t[1]} &nbsp; ${t[2]}${t[0]==='service'&&pending.length?' ('+pending.length+')':''}</button>`).join('')}</aside><main class="workspace"><div class="topline"><div><span class="eyebrow">Your restaurant workspace</span><h1>${{overview:'A clear view of your day.',menu:'Make the menu your own.',service:'Every guest, taken care of.',qr:'A little QR. A better connection.',settings:'The details that make it yours.'}[tab]}</h1></div><button class="btn small" onclick="go('menu')">View guest menu ↗</button></div>${tab==='overview'?`<div class="stats"><div class="card"><span class="muted">Menu products</span><strong>${state.items.length}</strong><span class="fine">${state.items.filter(d=>d.available).length} available</span></div><div class="card"><span class="muted">Open requests</span><strong>${pending.length}</strong><span class="fine">Demo activity only</span></div><div class="card"><span class="muted">Tables ready</span><strong>12</strong><span class="fine">Individual QR codes</span></div></div><div class="card"><span class="eyebrow">Your first service</span><h2>Let's bring your menu to the table.</h2><p class="muted">Edit a dish, open the guest menu and call the waiter. Your request will appear on the service board in this browser.</p><div class="actions"><button class="btn primary" onclick="tab='menu';render()">Edit your menu →</button><button class="btn" onclick="tab='service';render()">Service board</button></div></div><div class="card" style="margin-top:20px"><h3>Preview status</h3><p class="muted">Menu editing, CSV import, QR downloads and request handling work in this preview. Data is stored on this browser. This is not a live restaurant account; login, cross-device delivery, AI import and billing are not connected.</p></div>`:tab==='menu'?`<div class="topline"><span class="muted">${state.items.length} dishes · changes saved on this device</span><div><button class="btn small" onclick="importDialog()">Import CSV</button> <button class="btn primary small" onclick="edit()">+ Add product</button></div></div><div class="card" style="padding:12px;overflow:auto"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr></thead><tbody>${state.items.map(d=>`<tr><td><img src="${esc(d.image)}" alt="">${esc(d.name)}</td><td>${esc(d.category)}</td><td>${money(d.price)}</td><td><button class="btn small" onclick="toggle(${d.id})">${d.available?'Yes':'Sold out'}</button></td><td><button class="btn small" onclick="edit(${d.id})">Edit</button></td></tr>`).join('')}</tbody></table></div>`:tab==='service'?`<div class="topline"><span class="muted"><span class="dot"></span>${pending.length} open requests · browser demo</span><div><button class="btn small" onclick="enableSound()">♬ Enable sound</button> <button class="btn primary small" onclick="request('Waiter',true)">+ Test request</button></div></div>${pending.length?pending.sort((a,b)=>b.at-a.at).map(c=>`<div class="call"><div><b>Table ${c.table} · ${esc(c.type)}</b><span class="fine">${new Date(c.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${c.status==='taken'?'Taken by demo staff':'Waiting for your team'}</span></div><button class="btn ${c.status==='new'?'primary':''} small" onclick="advance('${c.id}')">${c.status==='new'?'Take request':'Mark resolved'} →</button></div>`).join(''):'<div class="card empty"><h3>All caught up.</h3><p>No open requests. Call a waiter from the guest menu or create a test request.</p></div>'}<h3 style="margin-top:30px">Resolved today</h3><p class="muted">${state.calls.filter(c=>c.status==='done').length} requests resolved on this device.</p><p class="fine">Keep this page open and the tablet awake. Cross-device delivery requires the production backend.</p>`:tab==='qr'?`<p class="muted">Codes link to this published preview. Live calls between different devices are not connected yet.</p><div class="qrgrid">${Array.from({length:12},(_,i)=>`<div class="card"><h3>Table ${i+1}</h3><img src="qr-${i+1}.svg" alt="QR code for table ${i+1}"><p><a class="btn small" href="qr-${i+1}.svg" download="smart-qr-table-${i+1}.svg">Download SVG ↓</a></p><button class="btn small" onclick="go('menu',${i+1})">Open table menu ↗</button></div>`).join('')}</div>`:`<div class="card"><form onsubmit="settings(event)"><label>Restaurant name<input id="venue" required maxlength="80" value="${esc(state.venue)}"></label><label>Menu currency<select id="currency">${['EUR','GBP','RON','USD'].map(c=>`<option ${state.currency===c?'selected':''}>${c}</option>`).join('')}</select></label><p class="fine">Changing currency changes the display symbol; it does not convert prices.</p><button class="btn primary">Save settings</button></form></div><div class="card" style="margin-top:20px"><h3>Demo data</h3><p class="muted">Restore the sample menu and clear guest requests on this browser.</p><button class="btn" onclick="reset()">Reset demo</button></div>`}</main></div>`}
function menu(){let shown=state.items.filter(d=>d.available&&(category==='All'||d.category===category));return `<div class="wrap"><div class="customer"><div class="cover"><div><span class="eyebrow" style="color:var(--brand-light)">Welcome to table ${table}</span><h2>${esc(state.venue)}</h2><span style="font-size:13px">Seasonal food. Shared moments.</span></div></div><div class="customer-body"><div class="servicebar"><button class="btn primary" onclick="request('Waiter')">♧ Call waiter</button><button class="btn" onclick="request('Bill')">Request bill</button></div><p class="fine">Illustrative menu · Review allergens with the restaurant before ordering.</p><div class="categories">${['All',...new Set(state.items.map(d=>d.category))].map(c=>`<button class="${category===c?'active':''}" onclick="category=this.textContent;render()">${esc(c)}</button>`).join('')}</div>${shown.length?shown.map(d=>`<article class="dish"><div style="flex:1"><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p><p style="font-size:11px">Allergens: ${esc(d.allergens||'Ask staff')}</p><b>${money(d.price)}</b></div><img src="${esc(d.image)}" alt="Illustrative photograph for ${esc(d.name)}" onerror="this.style.display='none'"></article>`).join(''):'<p class="empty">No available dishes in this category.</p>'}<p class="fine" style="text-align:center;margin-top:25px">Powered by Smart QR · Interactive preview</p><button class="btn small" style="width:100%" onclick="tab='service';go('dashboard')">Open staff demo to pick up your request →</button></div></div></div>`}
function render(){document.getElementById('root').innerHTML=header()+(view==='home'?home():`<div class="demo-strip">INTERACTIVE PREVIEW · Local browser data · No live accounts or payments</div>`+(view==='menu'?menu():dashboard()))}
function modal(html){document.getElementById('overlay').innerHTML='<div class="modal-bg"><div class="modal">'+html+'<button class="btn small" style="margin-top:15px" onclick="closeModal()">Close</button></div></div>'}function closeModal(){document.getElementById('overlay').innerHTML=''}
function onboard(){modal(`<span class="eyebrow">Make yourself at home</span><h2>Your first menu starts here.</h2><p class="muted">Create a demo workspace. No email or payment details needed. Data stays in this browser.</p><form onsubmit="start(event)"><label>Restaurant name<input name="name" placeholder="e.g. The Greenhouse" maxlength="80" required></label><button class="btn primary">Create demo workspace →</button></form>`)}function start(e){e.preventDefault();state.venue=e.target.name.value.trim()||'My Restaurant';save();closeModal();tab='menu';go('dashboard');toast('Your demo workspace is ready. Edit the sample menu to begin.')}function choose(p){modal(`<h2>${esc(p)}</h2><p class="muted">Explore this plan in the demo. No subscription will be created and no payment will be taken.</p><button class="btn primary" onclick="state.plan='${p}';save();closeModal();go('dashboard')">Open demo workspace →</button>`)}
const menuCategories=['Breakfast','Brunch','Starters','Soups','Salads','Mains','Pizza','Pasta','Burgers & Sandwiches','Sides','Kids’ Menu','Desserts','Bakery & Pastries','Coffee & Tea','Soft Drinks','Drinks','Beer & Cider','Wine','Cocktails','Spirits','Other'];
function menuCategorySelect(name,category,{required=true,showSource=false,label='Category'}={}){
  const choices=[...new Set([...menuCategories,...state.items.map(item=>item.category).filter(Boolean)])];
  const selected=choices.find(choice=>choice===category)||choices.find(choice=>choice.toLowerCase()===category.toLowerCase());
  const prompt=showSource&&category&&!selected?'Choose category (imported: '+category+')':'Select a category';
  return `<select name="${esc(name)}" aria-label="${esc(label)}" ${required?'required':''}><option value="" ${selected?'':'selected'}>${esc(prompt)}</option>${choices.map(choice=>`<option value="${esc(choice)}" ${choice===selected?'selected':''}>${esc(choice)}</option>`).join('')}</select>`;
}
function edit(id){let d=state.items.find(d=>d.id===id)||{name:'',desc:'',price:'',category:'',allergens:'',image:'',available:true};modal(`<h2>${id?'Edit product':'Add a delicious detail'}</h2><form onsubmit="saveDish(event,${id||0})"><label>Product name<input name="name" value="${esc(d.name)}" required maxlength="120"></label><div class="formgrid"><label>Price<input name="price" type="number" min="0" step=".01" value="${d.price}" required></label><label>Category${menuCategorySelect('category',d.category)}</label></div><label>Description<textarea name="desc" maxlength="600">${esc(d.desc)}</textarea></label><label>Allergens — supplied and verified by restaurant<input name="allergens" value="${esc(d.allergens)}" maxlength="200"></label><label>Photo URL (HTTPS)<input name="image" type="url" value="${esc(d.image)}" placeholder="https://..."></label><button class="btn primary">Save product</button> ${id?`<button type="button" class="btn" onclick="removeDish(${id})">Delete</button>`:''}</form>`)}
function saveDish(e,id){e.preventDefault();let f=new FormData(e.target),image=String(f.get('image'));if(image&&!image.startsWith('https://'))return toast('Use an HTTPS photo URL.');let d={id:id||Date.now(),name:String(f.get('name')).trim(),price:Number(f.get('price')),category:String(f.get('category')).trim(),desc:f.get('desc'),allergens:f.get('allergens'),image,available:state.items.find(x=>x.id===id)?.available??true};if(!d.name||!d.category)return toast('Name and category are required.');if(id)state.items=state.items.map(x=>x.id===id?d:x);else state.items.push(d);save();closeModal();render();toast('Product saved. Your guest menu is updated.')}function removeDish(id){state.items=state.items.filter(d=>d.id!==id);save();closeModal();render();toast('Product deleted.')}function toggle(id){state.items.find(d=>d.id===id).available=!state.items.find(d=>d.id===id).available;save();render()}
let audio;function enableSound(){audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();beep();toast('Sound enabled for this session. Keep the board open.')}function beep(){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=660;g.gain.value=.08;o.start();o.stop(audio.currentTime+.2)}function request(type,test=false){if(state.calls.some(c=>c.table===table&&c.type===type&&c.status!=='done'))return toast('Your request is already waiting.');state.calls.push({id:crypto.randomUUID(),table,type,status:'new',at:Date.now()});save();beep();if(test)render();toast('Table '+table+': '+type+' request sent to the demo service board.')}function advance(id){let c=state.calls.find(c=>c.id===id);c.status=c.status==='new'?'taken':'done';save();render()}
function settings(e){e.preventDefault();state.venue=document.getElementById('venue').value.trim()||'My Restaurant';state.currency=document.getElementById('currency').value;save();render();toast('Settings saved.')}function reset(){modal('<h2>Reset this demo?</h2><p class="muted">This removes your menu changes and requests from this browser.</p><button class="btn primary" onclick="localStorage.removeItem(\'tm-state\');location.reload()">Reset demo</button>')}
function importDialog(){modal(`<h2>Import your menu</h2><p class="muted">Upload a UTF-8 CSV with columns <b>name,price,category,description,allergens</b>. Imported dishes are added to your menu. PDF and AI import are planned.</p><input type="file" id="csv" accept=".csv,text/csv"><button class="btn primary" onclick="importCSV()">Import CSV →</button><p class="fine">Use decimal points for prices, for example 12.50.</p>`)}
function parseCSV(text){let rows=[],row=[],field='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){field+='"';i++}else q=!q}else if(c===','&&!q){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(q)throw Error('Unclosed quote in CSV.');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importCSV(){try{let f=document.getElementById('csv').files[0];if(!f)return toast('Choose a CSV file first.');if(f.size>1000000)throw Error('Maximum CSV size is 1 MB.');let rows=parseCSV((await f.text()).replace(/^\uFEFF/,'')),head=rows.shift().map(x=>x.trim().toLowerCase());if(!['name','price','category'].every(x=>head.includes(x)))throw Error('Required columns: name, price, category.');let items=rows.map((r,i)=>{let get=k=>r[head.indexOf(k)]?.trim()||'';if(!get('name')||!get('category')||!get('price')||!Number.isFinite(Number(get('price')))||Number(get('price'))<0)throw Error('Invalid name, category or price on row '+(i+2));return {id:Date.now()+i,name:get('name'),price:Number(get('price')),category:get('category'),desc:get('description'),allergens:get('allergens'),image:'',available:true}});if(!items.length)throw Error('No products found.');state.items.push(...items);save();closeModal();render();toast(items.length+' products imported. Review allergens before use.')}catch(e){toast(e.message)}}
</script></body></html>
