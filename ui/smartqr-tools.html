<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free QR code tools – SmartQR</title><meta name="description" content="Create QR codes for websites, contacts, email, phone, text and WhatsApp. Download SVG or PNG."><style>body{font:16px system-ui;background:#f4f7f5;color:#17382c;margin:0}main{max-width:800px;margin:auto;padding:24px}section{background:white;border:1px solid #d3ddd7;border-radius:12px;padding:24px;margin:16px 0}label{display:block;margin:12px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid #8da49a;border-radius:5px}input[type=checkbox]{width:auto}button,a.download{background:#145e43;color:white;padding:12px;border:0;border-radius:6px;font:inherit;margin:5px 0;display:inline-block}a{color:#145e43}img{display:block;max-width:100%;width:256px}button[hidden],img[hidden],a[hidden]{display:none}</style><main><a href="/smartqr">SmartQR</a><h1>Free QR code tools</h1><p>Static codes do not depend on a SmartQR subscription. No account needed. Always test before printing.</p><section><form id="form"><label>QR type<select id="type"><option value="website">Website</option><option value="text">Plain text</option><option value="email">Email</option><option value="phone">Telephone</option><option value="whatsapp">WhatsApp</option><option value="vcard">Contact card (vCard)</option></select></label><div id="fields"></div><label>Dark colour<input type="color" name="dark" value="#142d25"></label><label>Light colour<input type="color" name="light" value="#ffffff"></label><label>Export size<select name="size"><option>256</option><option selected>512</option><option>1024</option></select></label><button>Generate</button></form><p id="status" role="status"></p><img id="preview" alt="Generated QR code" hidden><a class="download" id="svg" download="smartqr.svg" hidden>Download SVG</a><button id="png" type="button" hidden>Download PNG</button><p>Do not encode passwords or other sensitive information using this server-based generator.</p></section></main><script>
const el=id=>document.getElementById(id),types={website:[['url','HTTPS website URL','url']],text:[['value','Text','text']],email:[['email','Email address','email'],['subject','Subject (optional)','text']],phone:[['phone','International telephone number','tel']],whatsapp:[['phone','International telephone number','tel'],['message','Message (optional)','text']],vcard:[['name','Full name','text'],['company','Company (optional)','text'],['email','Email (optional)','email'],['phone','Phone (optional)','tel']]};let objectURL,exportSize=512;
function fields(){el('fields').replaceChildren();for(const [name,label,type]of types[el('type').value]){const l=document.createElement('label'),i=document.createElement('input');l.textContent=label;i.name=name;i.type=type;i.required=!label.includes('optional');i.maxLength=name==='url'?2000:500;l.append(i);el('fields').append(l)}}el('type').onchange=fields;fields();
el('form').onsubmit=async e=>{e.preventDefault();el('preview').hidden=el('svg').hidden=el('png').hidden=true;try{const data=Object.fromEntries(new FormData(e.target));data.type=el('type').value;data.size=Number(data.size);const r=await fetch('/api/smartqr/tools/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Check QR content and colour contrast.');if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(await r.blob());exportSize=data.size;el('preview').src=objectURL;el('svg').href=objectURL;el('preview').hidden=el('svg').hidden=el('png').hidden=false;el('status').textContent='QR generated. Scan to verify.'}catch(e){el('status').textContent=e.message}};
el('png').onclick=async()=>{try{const image=new Image();image.src=objectURL;await image.decode();const canvas=document.createElement('canvas');canvas.width=canvas.height=exportSize;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(image,0,0,exportSize,exportSize);canvas.toBlob(blob=>{if(!blob){el('status').textContent='PNG conversion failed';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='smartqr.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')}catch(e){el('status').textContent=e.message}};
</script></html>
