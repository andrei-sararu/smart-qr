<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartQR Digital Business Card</title><style>body{margin:0;background:#edf3ef;color:#153b30;font:16px system-ui}main{max-width:600px;margin:auto;padding:24px}section{background:white;border:1px solid #d3ddd7;border-radius:16px;padding:24px;margin:16px 0}label{display:block;margin:10px 0}input{box-sizing:border-box;width:100%;padding:10px;font:inherit}input[type=checkbox]{width:auto}button,a.action{display:inline-block;padding:12px;background:#145e43;color:white;border:0;border-radius:6px;font:inherit;margin:6px 0}a{color:#145e43;overflow-wrap:anywhere}p{overflow-wrap:anywhere}img{width:200px}</style><main><a href="/smartqr">SmartQR</a><h1>Digital business card</h1><p id="status" role="status"></p><section id="editor" hidden><p>Only publish information you want anyone with the link to see. You can unpublish the card.</p><form id="form"><label>Name<input name="name" maxlength="100" required></label><label>Company<input name="company" maxlength="100"></label><label>Job title<input name="role" maxlength="100"></label><label>Public email<input name="email" type="email" maxlength="254"></label><label>Public phone<input name="phone" maxlength="40"></label><label>Website<input name="website" type="url" maxlength="500"></label><label><input name="published" type="checkbox"> Publish my card publicly</label><button>Save card</button></form><div id="share"></div></section><section id="public" hidden><h2 id="name"></h2><p id="job"></p><div id="contacts"></div><button id="vcard">Save contact</button></section><a id="login" href="/api/smartqr/auth/login" hidden>Sign in</a></main><script>
const el=id=>document.getElementById(id),params=new URLSearchParams(location.search),publicId=params.get('id');let revision=0,current;
async function api(path,method='GET',data){const r=await fetch('/api/smartqr/cards/'+path,{method,...(data?{headers:{'content-type':'application/json'},body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
const status=s=>el('status').textContent=s;
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function link(parent,label,url){const a=document.createElement('a');a.textContent=label;a.href=url;a.rel='noopener noreferrer';const p=document.createElement('p');p.append(a);parent.append(p)}
function share(card){const out=el('share');out.replaceChildren();if(!card.published)return;const url=location.origin+'/smartqr/card?id='+card.id;link(out,'Open public card',url);const b=document.createElement('button');b.textContent='Download card QR';b.onclick=async()=>{try{const r=await fetch('/api/smartqr/tools/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'website',url})});if(!r.ok)throw Error('QR generation failed');download(await r.blob(),'business-card.svg')}catch(e){status(e.message)}};out.append(b)}
async function load(){try{if(publicId){const d=await api('public/'+encodeURIComponent(publicId));current=d.card;el('public').hidden=false;el('name').textContent=current.name;el('job').textContent=[current.role,current.company].filter(Boolean).join(' · ');if(current.email)link(el('contacts'),current.email,'mailto:'+current.email);if(current.phone)link(el('contacts'),current.phone,'tel:'+current.phone.replace(/[ ()-]/g,''));if(current.website)link(el('contacts'),'Website',current.website);return}const d=await api('mine');el('editor').hidden=false;if(d.card){revision=d.card.revision;for(const k of ['name','company','role','email','phone','website'])el('form').elements[k].value=d.card[k];el('form').elements.published.checked=!!d.card.published;share(d.card)}}catch(e){status(e.message);if(!publicId)el('login').hidden=false}}
el('form').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));d.published=e.target.elements.published.checked;d.revision=revision;await api('mine','PUT',d);status('Saved');await load()}catch(e){status(e.message)}};
el('vcard').onclick=()=>{if(!current)return;const esc=s=>s.replace(/[\\;,]/g,'\\$&');const v=['BEGIN:VCARD','VERSION:3.0','FN:'+esc(current.name),'N:'+esc(current.name)+';;;;',current.company?'ORG:'+esc(current.company):'',current.role?'TITLE:'+esc(current.role):'',current.email?'EMAIL:'+current.email:'',current.phone?'TEL:'+current.phone:'',current.website?'URL:'+current.website:'','END:VCARD'].filter(Boolean).join('\r\n');download(new Blob([v],{type:'text/vcard'}),'contact.vcf')};load();
</script></html>
